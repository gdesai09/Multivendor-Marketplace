<!DOCTYPE html>
<html lang="en">
<head>
  <title>Vendor Login — Vendra</title>
  <link rel="stylesheet" href="/CSS/style.css"/>
</head>
<body>
  <div class="maincontainer">
    <h2>Vendor Login</h2>

    <label>Email</label>
    <input type="email" id="email" placeholder="shop@email.com" required />

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" required />

    <p id="err" style="color:#e05;font-size:.8rem;min-height:1rem;margin-bottom:.5rem"></p>

    <button onclick="loginVendor()">Login</button>

    <p style="margin-top:1rem">Don't have an account?</p>
    <a href="/vendor/register">Register here</a>
  </div>

  <script>
    async function loginVendor() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const err      = document.getElementById("err");

      err.textContent = "";

      if (!email || !password) {
        err.textContent = "Please fill all fields ❌";
        return;
      }

      try {
        const res = await fetch("/vendor/login", {  // ✅ fixed
          method:      "POST",
          headers:     { "Content-Type": "application/json" },
          credentials: "include",
          body:        JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          window.location.href = "/vendor";
        } else {
          err.textContent = data.message;
        }

      } catch (e) {
        err.textContent = "Network error ❌";
        console.error(e);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loginVendor();
    });
  </script>
</body>
</html>
