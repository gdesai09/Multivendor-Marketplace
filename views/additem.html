<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add Product — Vendra</title>
  <link rel="stylesheet" href="/CSS/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{background:#0d0b09;color:#f0e8d8;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .maincontainer{background:#1a1714;border:1px solid #2a2520;border-radius:12px;padding:2.5rem;width:100%;max-width:480px;}
    h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:#f0e8d8;margin-bottom:1.8rem;text-align:center;}
    h2 em{font-style:italic;color:#d4843a;}
    label{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#7a7068;margin-bottom:.4rem;}
    input, select{width:100%;background:#141210;border:1px solid #2a2520;border-radius:6px;padding:.6rem .8rem;color:#f0e8d8;font-family:'DM Sans',sans-serif;font-size:.9rem;margin-bottom:1.2rem;outline:none;transition:border-color .2s;height:auto;}
    input:focus, select:focus{border-color:#d4843a;}
    select option{background:#1a1714;color:#f0e8d8;}
    .btn{width:100%;padding:.75rem;background:#d4843a;color:#0d0b09;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s;margin-bottom:.8rem;}
    .btn:hover{background:#e8a862;}
    .btn-ghost{width:100%;padding:.65rem;background:transparent;color:#7a7068;border:1px solid #2a2520;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.78rem;cursor:pointer;transition:border-color .2s,color .2s;text-align:center;text-decoration:none;display:block;}
    .btn-ghost:hover{border-color:#d4843a;color:#d4843a;}
    #err{color:#e05050;font-size:.78rem;min-height:1rem;margin-bottom:.8rem;text-align:center;}
    #suc{color:#4caf7d;font-size:.78rem;min-height:1rem;margin-bottom:.8rem;text-align:center;}

    /* image preview */
    .img-preview{width:100%;height:180px;background:#141210;border:1px solid #2a2520;border-radius:8px;margin-bottom:1.2rem;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .img-preview img{width:100%;height:100%;object-fit:cover;display:none;}
    .img-preview span{font-size:.75rem;color:#7a7068;}
  </style>
</head>
<body>

  <div class="maincontainer">
    <h2>Add <em>Product</em></h2>

    <label>Product Name</label>
    <input type="text" id="name" placeholder="e.g. Wireless Earbuds" required />

    <label>Price (₹)</label>
    <input type="number" id="price" placeholder="0" min="1" required />

    <label>Category</label>
    <select id="category">
      <option value="General">General</option>
      <option value="Electronics">Electronics</option>
      <option value="Clothing">Clothing</option>
      <option value="Books">Books</option>
      <option value="Home & Kitchen">Home & Kitchen</option>
      <option value="Accessories">Accessories</option>
      <option value="Food & Beverages">Food & Beverages</option>
      <option value="Sports">Sports</option>
      <option value="Beauty">Beauty</option>
      <option value="Toys">Toys</option>
    </select>

    <label>Image URL</label>
    <input type="text" id="image" placeholder="https://example.com/image.jpg"
           oninput="previewImage(this.value)" required />

    <!-- ✅ live image preview -->
    <div class="img-preview" id="preview">
      <img id="preview-img" src="" alt="preview"/>
      <span id="preview-placeholder">Image preview will appear here</span>
    </div>

    <p id="err"></p>
    <p id="suc"></p>

    <button class="btn" onclick="addProduct()">Add Product</button>
    <a href="/vendor" class="btn-ghost">← Back to Dashboard</a>
  </div>

  <script>
    // ✅ live image preview
    function previewImage(url) {
      const img         = document.getElementById("preview-img");
      const placeholder = document.getElementById("preview-placeholder");
      if (url) {
        img.src              = url;
        img.style.display    = "block";
        placeholder.style.display = "none";
        img.onerror = () => {
          img.style.display         = "none";
          placeholder.style.display = "block";
          placeholder.textContent   = "Invalid image URL";
        };
      } else {
        img.style.display         = "none";
        placeholder.style.display = "block";
        placeholder.textContent   = "Image preview will appear here";
      }
    }

    async function addProduct() {
      const name     = document.getElementById("name").value.trim();
      const price    = document.getElementById("price").value;
      const image    = document.getElementById("image").value.trim();
      const category = document.getElementById("category").value;
      const err      = document.getElementById("err");
      const suc      = document.getElementById("suc");

      err.textContent = "";
      suc.textContent = "";

      if (!name) { err.textContent = "Product name is required ❌"; return; }
      if (!price || Number(price) <= 0) { err.textContent = "Valid price is required ❌"; return; }
      if (!image) { err.textContent = "Image URL is required ❌"; return; }

      try {
        const res  = await fetch("/vendor/add-product", {  // ✅ correct URL
          method:      "POST",
          headers:     { "Content-Type": "application/json" },
          credentials: "include",
          body:        JSON.stringify({ name, price, image, category }),
          // ✅ shopName comes from JWT on server — not sent from client
        });

        const data = await res.json();

        if (res.ok) {
          suc.textContent = "Product added successfully ✅";
          // ✅ clear form
          document.getElementById("name").value  = "";
          document.getElementById("price").value = "";
          document.getElementById("image").value = "";
          document.getElementById("category").value = "General";
          previewImage("");
          setTimeout(() => window.location.href = "/vendor", 1500);
        } else {
          err.textContent = data.message;
        }

      } catch (e) {
        err.textContent = "Network error ❌";
        console.error(e);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addProduct();
    });
  </script>

</body>
</html>
